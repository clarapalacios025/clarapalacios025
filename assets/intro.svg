<text x="40" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#ffe3f1">Hi, I'm <tspan fill="#ff7bc8">Clara</tspan></text>
<text x="40" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#ffe3f1">Information Science &amp; Technology student <tspan fill="#c99ab8">·</tspan> <tspan fill="#ff7bc8">William Paterson University</tspan></text>
<text x="40" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#c99ab8">I build across software, the web, and games, and I like figuring out how systems fit together.</text><text x="40" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#c99ab8">Lately most of my time goes into Python, backend work, APIs, and apps that use AI/ML.</text>
